name: Stage 0-1 Verify

on:
  workflow_dispatch:
  push:
    branches:
      - app
      - agent/stage01-work
  pull_request:
    branches:
      - app

jobs:
  python-and-structure:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow pyyaml fastapi httpx
      - name: Repository structure
        run: python3 scripts/check_repository_structure.py
      - name: Legacy strings
        run: python3 scripts/check_legacy_strings.py
      - name: Import boundaries
        run: python3 scripts/check_import_boundaries.py
      - name: Python compile
        run: python3 -m compileall -q src
      - name: Shell syntax
        run: find src -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Host Unit and Mock
        run: python3 -m pytest -q src/host/tests
      - name: UWB Unit and Mock
        run: python3 -m pytest -q src/uwb/tests
      - name: d_slam Unit and Mock
        run: python3 -m pytest -q src/d_slam/tests
      - name: ROS availability
        run: |
          if command -v colcon >/dev/null 2>&1 && [[ -n "${ROS_DISTRO:-}" ]]; then
            echo "ROS environment is available; run responsibility build scripts."
            src/host/scripts/build.sh
            src/uwb/scripts/build.sh
            src/d_slam/scripts/build.sh
          else
            echo "ROS colcon not run: ubuntu-22.04 GitHub runner has no sourced ROS 2 Humble environment."
          fi

  flutter-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Host Flutter analyze
        working-directory: src/host/flutter_app
        run: flutter pub get && flutter analyze
      - name: Host Flutter test
        working-directory: src/host/flutter_app
        run: flutter test

  flutter-jetson:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Jetson Flutter analyze
        working-directory: src/d_slam/flutter_app
        run: flutter pub get && flutter analyze
      - name: Jetson Flutter test
        working-directory: src/d_slam/flutter_app
        run: flutter test
