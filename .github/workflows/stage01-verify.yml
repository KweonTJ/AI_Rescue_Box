name: Stage 0-5 Verify

on:
  workflow_dispatch:
  push:
    branches:
      - app
      - agent/stage01-work
  pull_request:
    branches:
      - app

jobs:
  python-and-structure:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install product and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e 'src/uwb/protocol[serial]' \
            -e 'src/host/host_app[test]' \
            -e 'src/d_slam/jetson_app[api,test]' \
            pillow pyyaml fastapi httpx numpy
      - name: Repository structure
        run: python3 scripts/check_repository_structure.py
      - name: Contract alignment
        run: python3 scripts/check_contract_alignment.py
      - name: Legacy strings
        run: python3 scripts/check_legacy_strings.py
      - name: Import boundaries
        run: python3 scripts/check_import_boundaries.py
      - name: Python compile
        run: python3 -m compileall -q src
      - name: Shell syntax
        run: find src deploy -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy/host_windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse failed: $($_.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }
      - name: Host Unit and Mock
        run: python3 -m pytest -q src/host/tests
      - name: UWB Unit and Mock
        run: python3 -m pytest -q src/uwb/tests
      - name: d_slam Unit and Mock
        run: python3 -m pytest -q src/d_slam/tests
      - name: Stage 2 E2E
        run: python3 -m pytest -q tests/stage2/e2e
      - name: Stage 3 Analysis Integration
        run: python3 -m pytest -q tests/stage3
      - name: Stage 4 Map Planning Integration
        run: python3 -m pytest -q tests/stage4
      - name: Stage 5 Serial and Deployment
        run: python3 -m pytest -q tests/stage5
      - name: ROS availability
        run: |
          if command -v colcon >/dev/null 2>&1 && [[ -n "${ROS_DISTRO:-}" ]]; then
            src/host/scripts/build.sh
            src/uwb/scripts/build.sh
            src/d_slam/scripts/build.sh
          else
            echo "ROS build not run: runner has no sourced ROS 2 environment."
          fi

  flutter-host-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - working-directory: src/host/flutter_app
        run: flutter pub get && flutter analyze
      - working-directory: src/host/flutter_app
        run: flutter test
      - working-directory: src/host/flutter_app
        run: flutter build web --release

  flutter-tablet-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - working-directory: src/d_slam/flutter_app
        run: flutter pub get && flutter analyze
      - working-directory: src/d_slam/flutter_app
        run: flutter test
      - name: Build Tablet debug APK
        run: ./deploy/tablet_android/build_apk.sh --debug
      - name: Validate Tablet release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f src/d_slam/flutter_app/android/key.properties.example
          grep -q '^storePassword=CHANGE_ME$' src/d_slam/flutter_app/android/key.properties.example
          grep -q 'hasReleaseSigning' src/d_slam/flutter_app/android/app/build.gradle.kts
          ./deploy/tablet_android/build_apk.sh --help >/dev/null
          echo "Signed release APK is not built in CI without a user-provided signing key."

  firmware-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('src/uwb/firmware/platformio.ini', 'src/uwb/firmware/src/**/*.cpp') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile Host and Jetson firmware roles
        working-directory: src/uwb/firmware
        run: pio run -e host_node -e jetson_node

  publish-ci-status:
    if: ${{ always() }}
    needs:
      - python-and-structure
      - flutter-host-web
      - flutter-tablet-android
      - firmware-compile
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
    steps:
      - name: Publish aggregate Stage 0-5 commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_RESULT: ${{ needs.python-and-structure.result }}
          HOST_FLUTTER_RESULT: ${{ needs.flutter-host-web.result }}
          TABLET_RESULT: ${{ needs.flutter-tablet-android.result }}
          FIRMWARE_RESULT: ${{ needs.firmware-compile.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          for result in "$PYTHON_RESULT" "$HOST_FLUTTER_RESULT" "$TABLET_RESULT" "$FIRMWARE_RESULT"; do
            if [[ "$result" != success ]]; then
              state=failure
            fi
          done
          description="Stage 0-5 Verify: $state"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(CI_STATE="$state" CI_DESCRIPTION="$description" CI_TARGET_URL="$run_url" python3 -c 'import json,os; print(json.dumps({"state":os.environ["CI_STATE"],"context":"stage0-5-verify/aggregate","description":os.environ["CI_DESCRIPTION"],"target_url":os.environ["CI_TARGET_URL"]}))')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
          [[ "$state" == success ]]
