name: Build Tablet APK

on:
  workflow_dispatch:
    inputs:
      jetson_api_url:
        description: Jetson FastAPI base URL
        required: true
        default: http://192.168.50.1:8001
        type: string

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Tablet debug APK
        run: |
          ./deploy/tablet_android/build_apk.sh --debug \
            --api-url "${{ inputs.jetson_api_url }}"

      - name: Verify APK output
        run: |
          test -f dist/tablet/ai-rescue-box-tablet-debug.apk
          test -f dist/tablet/ai-rescue-box-tablet-debug.apk.sha256
          cat dist/tablet/ai-rescue-box-tablet-debug.apk.sha256

      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-rescue-box-tablet-debug
          path: |
            dist/tablet/ai-rescue-box-tablet-debug.apk
            dist/tablet/ai-rescue-box-tablet-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
