name: total-targeted

on:
  push:
    branches: [total]
  workflow_dispatch:

jobs:
  python-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install only targeted Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/uwb/protocol[serial]'
          python -m pip install -e './src/host/host_app[test]'
          python -m pip install -e './src/d_slam/jetson_app[api,test]'
      - name: Compile changed Python packages
        run: |
          python -m compileall -q src/host/host_app/host_app
          python -m compileall -q src/d_slam/jetson_app/jetson_app
          python -m compileall -q src/uwb/protocol
      - name: Mission sync
        run: pytest -q src/host/tests/test_tablet_mission_sync.py
      - name: Entry / return route
        run: pytest -q tests/stage4/test_return_routes_business_plan.py
      - name: Hazard detection
        run: pytest -q src/d_slam/tests/test_hazard_detection_business_plan.py

  host-flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Host Flutter analyze
        working-directory: src/host/flutter_app
        run: |
          flutter pub get
          flutter analyze

  tablet-flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tablet Flutter analyze
        working-directory: src/d_slam/flutter_app
        run: |
          flutter pub get
          flutter analyze
