name: total-targeted

on:
  push:
    branches: [total]
    paths-ignore:
      - 'ci/total-targeted-result.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-targeted:
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.results.outputs.compile }}
      mission: ${{ steps.results.outputs.mission }}
      return_route: ${{ steps.results.outputs.return_route }}
      hazard: ${{ steps.results.outputs.hazard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install only targeted Python dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/uwb/protocol[serial]'
          python -m pip install -e './src/host/host_app[test]'
          python -m pip install -e './src/d_slam/jetson_app[api,test]'
      - name: Compile changed Python packages
        id: compile
        if: always()
        continue-on-error: true
        run: |
          python -m compileall -q src/host/host_app/host_app
          python -m compileall -q src/d_slam/jetson_app/jetson_app
          python -m compileall -q src/uwb/protocol
      - name: Mission sync
        id: mission
        if: always()
        continue-on-error: true
        run: pytest -q src/host/tests/test_tablet_mission_sync.py
      - name: Entry / return route
        id: return_route
        if: always()
        continue-on-error: true
        run: pytest -q tests/stage4/test_return_routes_business_plan.py
      - name: Hazard detection
        id: hazard
        if: always()
        continue-on-error: true
        run: pytest -q src/d_slam/tests/test_hazard_detection_business_plan.py
      - name: Export Python outcomes
        id: results
        if: always()
        run: |
          echo "compile=${{ steps.compile.outcome }}" >> "$GITHUB_OUTPUT"
          echo "mission=${{ steps.mission.outcome }}" >> "$GITHUB_OUTPUT"
          echo "return_route=${{ steps.return_route.outcome }}" >> "$GITHUB_OUTPUT"
          echo "hazard=${{ steps.hazard.outcome }}" >> "$GITHUB_OUTPUT"

  host-flutter-analyze:
    runs-on: ubuntu-latest
    outputs:
      analyze: ${{ steps.results.outputs.analyze }}
      log_b64: ${{ steps.results.outputs.log_b64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Host Flutter analyze
        id: analyze
        continue-on-error: true
        working-directory: src/host/flutter_app
        run: |
          set -o pipefail
          { flutter pub get && flutter analyze; } 2>&1 | tee "$RUNNER_TEMP/host-analyze.log"
      - name: Export Host Flutter outcome
        id: results
        if: always()
        run: |
          echo "analyze=${{ steps.analyze.outcome }}" >> "$GITHUB_OUTPUT"
          log_b64="$(tail -n 80 "$RUNNER_TEMP/host-analyze.log" 2>/dev/null | base64 -w0 || true)"
          echo "log_b64=$log_b64" >> "$GITHUB_OUTPUT"

  tablet-flutter-analyze:
    runs-on: ubuntu-latest
    outputs:
      analyze: ${{ steps.results.outputs.analyze }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tablet Flutter analyze
        id: analyze
        continue-on-error: true
        working-directory: src/d_slam/flutter_app
        run: |
          flutter pub get
          flutter analyze
      - name: Export Tablet Flutter outcome
        id: results
        if: always()
        run: echo "analyze=${{ steps.analyze.outcome }}" >> "$GITHUB_OUTPUT"

  record-results:
    runs-on: ubuntu-latest
    if: always()
    needs: [python-targeted, host-flutter-analyze, tablet-flutter-analyze]
    env:
      TESTED_COMMIT: ${{ github.sha }}
      PYTHON_COMPILE: ${{ needs.python-targeted.outputs.compile }}
      MISSION_SYNC: ${{ needs.python-targeted.outputs.mission }}
      RETURN_ROUTE: ${{ needs.python-targeted.outputs.return_route }}
      HAZARD: ${{ needs.python-targeted.outputs.hazard }}
      HOST_FLUTTER: ${{ needs.host-flutter-analyze.outputs.analyze }}
      HOST_LOG_B64: ${{ needs.host-flutter-analyze.outputs.log_b64 }}
      TABLET_FLUTTER: ${{ needs.tablet-flutter-analyze.outputs.analyze }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: total
      - name: Write compact verification result
        run: |
          mkdir -p ci
          python - <<'PY'
          import base64, json, os
          raw = os.environ.get("HOST_LOG_B64", "")
          try:
              host_log = base64.b64decode(raw).decode("utf-8", errors="replace") if raw else ""
          except Exception:
              host_log = ""
          result = {
              "tested_commit": os.environ.get("TESTED_COMMIT", ""),
              "python_compile": os.environ.get("PYTHON_COMPILE", "unknown") or "unknown",
              "mission_sync": os.environ.get("MISSION_SYNC", "unknown") or "unknown",
              "return_route": os.environ.get("RETURN_ROUTE", "unknown") or "unknown",
              "hazard_detection": os.environ.get("HAZARD", "unknown") or "unknown",
              "host_flutter_analyze": os.environ.get("HOST_FLUTTER", "unknown") or "unknown",
              "tablet_flutter_analyze": os.environ.get("TABLET_FLUTTER", "unknown") or "unknown",
              "host_flutter_log": host_log,
          }
          with open("ci/total-targeted-result.json", "w", encoding="utf-8") as stream:
              json.dump(result, stream, ensure_ascii=False, indent=2, sort_keys=True)
              stream.write("\n")
          PY
      - name: Commit result without retriggering verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/total-targeted-result.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record targeted verification [skip ci]"
          git push origin total
