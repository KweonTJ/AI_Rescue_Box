[platformio]
default_envs = host_node
src_dir = src

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/thotro/arduino-dw1000.git#v0.9

; Upload/monitor ports are intentionally not fixed. Supply the real Stage 5B
; device with `pio run -e <role> -t upload --upload-port <PORT>`.
[env:host_node]
build_flags =
    -D NODE_ID=1
    -D PEER_ID=2
    -D AI_RESCUE_ROLE_HOST=1

[env:jetson_node]
build_flags =
    -D NODE_ID=2
    -D PEER_ID=1
    -D AI_RESCUE_ROLE_JETSON=1

; Backward-compatible Stage 2 environment name.
[env:laptop_node]
extends = env:host_node
