mode: real
data_root: data
model_path: null
detection_confidence: 0.5

depth_minimum_m: 0.15
depth_maximum_m: 10.0
sensor_sync_tolerance_s: 0.25
slam_map_frame: map
slam_odom_frame: odom
confirmation_observations: 2

# Initial guess / fallback for Stage 4 Prior↔Live alignment.
mission_transform_mode: initial_anchor
mission_transform_x_m: null
mission_transform_y_m: null
mission_transform_yaw_radians: null

map_preview_interval_seconds: 60
map_preview_max_dimension: 768
occupied_threshold: 65
minimum_passage_width_m: 0.8

stage4:
  prior_dark_threshold: 64
  prior_free_threshold: 220
  alignment_translation_search_m: 1.5
  alignment_translation_coarse_step_m: 0.25
  alignment_translation_fine_step_m: 0.05
  alignment_yaw_search_radians: 0.17453292519943295
  alignment_yaw_coarse_step_radians: 0.08726646259971647
  alignment_yaw_fine_step_radians: 0.017453292519943295
  alignment_min_confidence: 0.55
  alignment_min_overlap: 0.35
  alignment_min_coverage: 0.20
  alignment_min_known_cells: 25
  alignment_min_occupied_cells: 8
  alignment_max_samples: 2500
  robot_clearance_m: 0.25
  prior_reference_wall_block: true
  narrow_passage_cost_value: 45
  traversability_risk_weight: 30.0
  traversability_block_risk_severity: 0.85
  route_candidate_count: 3
  route_distinctness_min: 0.20
  route_corridor_radius_cells: 0
  route_score_distance_weight: 1.0
  route_score_risk_weight: 1.0
  route_score_unknown_weight: 10.0
  route_score_change_weight: 5.0
  route_score_clearance_weight: 1.0
  safe_zone_count: 3
  safe_zone_min_clearance_m: 0.50
  safe_zone_spacing_m: 1.0
  safe_zone_change_distance_m: 0.75
  safe_zone_risk_block_severity: 0.70

topics:
  rgb: /camera/color/image_raw
  depth: /camera/depth/image_raw
  camera_info: /camera/color/camera_info
  point_cloud: ""
  occupancy_grid: /rtabmap/map
  odometry: /rtabmap/odom
  robot_pose: /rtabmap/localization_pose
  rtabmap_status: /rtabmap/info
