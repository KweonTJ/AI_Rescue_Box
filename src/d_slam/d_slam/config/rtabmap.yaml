rgbd_odometry:
  ros__parameters:

    frame_id: base_link
    odom_frame_id: odom

    publish_tf: true

    approx_sync: true
    approx_sync_max_interval: 0.05

    qos: 1
    qos_camera_info: 1

    wait_for_transform: 0.2

    Odom/Strategy: "0"
    OdomF2M/MaxSize: "1000"
    Odom/ResetCountdown: "1"

    Vis/MinInliers: "15"
    Vis/FeatureType: "6"
    Vis/MaxFeatures: "1000"


rtabmap:
  ros__parameters:

    frame_id: base_link
    odom_frame_id: odom
    map_frame_id: map

    subscribe_depth: true
    subscribe_rgb: true

    approx_sync: true

    qos_image: 1
    qos_camera_info: 1

    publish_tf: true

    Mem/IncrementalMemory: "true"

    RGBD/NeighborLinkRefining: "true"
    RGBD/ProximityBySpace: "true"

    Grid/FromDepth: "true"
    Grid/3D: "true"

    Reg/Strategy: "0"

    Vis/MinInliers: "15"
