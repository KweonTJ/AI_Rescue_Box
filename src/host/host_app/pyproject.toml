[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rescue-box-host"
version = "0.2.0"
description = "AI Rescue Box Host mission preparation and review application"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0,<13",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pyserial>=3.5,<4",
    "uvicorn>=0.30,<1",
    "websockets>=10,<16",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "fastapi>=0.115,<1", "pydantic>=2.8,<3"]

[project.scripts]
ai-rescue-host = "host_app.__main__:main"
ai-rescue-host-api = "host_app.api.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["host_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
