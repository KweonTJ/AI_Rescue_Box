# Shared RGB-D synchronization. One synchronized RGBDImage stream is reused by
# visual odometry and graph SLAM. Larger queues absorb Astra timestamp jitter
# without forcing RTAB-Map to wait for a second synchronization stage.
rgbd_sync:
  ros__parameters:
    approx_sync: true
    approx_sync_max_interval: 0.05
    topic_queue_size: 10
    sync_queue_size: 10
    qos: 2
    qos_camera_info: 2
    depth_scale: 1.0

# Handheld RGB-D visual odometry accuracy profile.
#
# F2M keeps a local feature map instead of matching only adjacent frames.
# Local g2o bundle adjustment jointly refines recent keyframes and landmarks.
rgbd_odometry:
  ros__parameters:
    frame_id: camera_link
    odom_frame_id: odom
    publish_tf: true
    subscribe_rgbd: true
    wait_for_transform: 0.2
    qos: 2
    qos_camera_info: 2
    always_process_most_recent_frame: true

    Odom/Strategy: "0"
    Odom/ResetCountdown: "10"
    Odom/ImageDecimation: "1"
    Odom/GuessMotion: "true"
    Odom/FilteringStrategy: "0"
    Odom/VisKeyFrameThr: "200"

    OdomF2M/MaxSize: "1500"
    OdomF2M/BundleAdjustment: "1"
    OdomF2M/BundleAdjustmentMaxFrames: "12"

    # GFTT detector + ORB descriptor is broadly available in OpenCV builds.
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1200"
    Vis/MinInliers: "20"
    Vis/MinDepth: "0.3"
    Vis/MaxDepth: "4.5"

# RTAB-Map global graph, loop closure, and 2D occupancy map.
#
# Neighbor links are re-registered before insertion. When a loop closure is
# accepted, local bundle adjustment refines the closure neighborhood before
# the global graph is optimized with g2o.
rtabmap:
  ros__parameters:
    frame_id: camera_link
    odom_frame_id: odom
    map_frame_id: map
    publish_tf: true

    subscribe_rgb: false
    subscribe_depth: false
    subscribe_rgbd: true
    subscribe_odom_info: false
    approx_sync: true
    approx_sync_max_interval: 0.05
    wait_for_transform: 0.2

    qos_image: 2
    qos_camera_info: 2
    qos_odom: 1

    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"

    Rtabmap/DetectionRate: "3.0"
    Rtabmap/TimeThr: "0"
    Rtabmap/LoopThr: "0.11"

    # Visual words used for global loop-closure hypotheses.
    Kp/DetectorStrategy: "8"
    Kp/MaxFeatures: "1200"

    RGBD/CreateOccupancyGrid: "true"
    RGBD/NeighborLinkRefining: "true"
    RGBD/LocalBundleOnLoopClosure: "true"
    RGBD/LoopCovLimited: "true"
    RGBD/ProximityBySpace: "true"

    Optimizer/Strategy: "1"
    Optimizer/Iterations: "30"

    # Keep the default map 2D-first for handheld tests. Higher-resolution local
    # grids and radius filtering reduce isolated depth speckles.
    Grid/Sensor: "1"
    Grid/3D: "false"
    Grid/DepthDecimation: "2"
    Grid/RangeMin: "0.3"
    Grid/RangeMax: "4.5"
    Grid/CellSize: "0.05"
    Grid/NoiseFilteringRadius: "0.08"
    Grid/NoiseFilteringMinNeighbors: "5"
    Grid/RayTracing: "true"

    Reg/Strategy: "0"
    Vis/BundleAdjustment: "1"
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1200"
    Vis/MinInliers: "25"
    Vis/MinDepth: "0.3"
    Vis/MaxDepth: "4.5"
